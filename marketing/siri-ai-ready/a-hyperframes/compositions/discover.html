  <script>
    const tl = gsap.timeline({ paused: true });
    tl.fromTo("#discover-kicker", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.05);
    tl.fromTo("#discover-head", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, 0.1);
    tl.to(["#discover-kicker", "#discover-head"], { opacity: 0, y: -20, duration: 0.3, ease: "power2.in" }, 8.4);
    tl.to({}, { duration: 8.74 }, 0);
    const host = document.querySelector('[data-composition-id="discover"][data-start]');
    const START = Number(host.dataset.start);
    const DURATION = Number(host.dataset.duration);
    const canvas = document.getElementById("discover-canvas");
    const sheets = {
      skill: document.getElementById("discover-skill"),
      list: document.getElementById("discover-list"),
      swift: document.getElementById("discover-swift"),
    };
    const ctx = canvas.getContext("2d");
    const PANELS = 8;
    const WIDTH = 940;
    const HEIGHT = 820;
    const LEFT = 70;
    let painted = null;

    const ease = (x) => 1 - Math.pow(1 - Math.min(Math.max(x, 0), 1), 3);
    function opened(t, open, close) {
      if (t < open) return 0;
      if (close !== undefined && t >= close) return 1 - ease((t - close) / 0.45);
      return ease((t - open) / 0.9);
    }

    function unfold(sheet, progress) {
      if (progress <= 0.001) return;
      const panel = HEIGHT / PANELS;
      const squash = Math.max(progress, 0.02);
      let y = 0;
      for (let i = 0; i < PANELS; i++) {
        const lag = Math.min(1, Math.max(0, progress * PANELS - i * 0.55));
        const scale = squash * (0.35 + 0.65 * lag);
        ctx.save();
        ctx.translate(LEFT, 20 + y);
        ctx.scale(1, scale);
        ctx.beginPath();
        ctx.rect(0, 0, WIDTH, panel + 0.8);
        ctx.clip();
        ctx.drawElementImage(sheet, 0, -i * panel);
        ctx.globalCompositeOperation = "source-atop";
        ctx.fillStyle = i % 2 ? `rgba(40,25,10,${0.35 * (1 - scale)})` : `rgba(255,250,240,${0.25 * (1 - scale)})`;
        ctx.fillRect(0, 0, WIDTH, panel + 0.8);
        ctx.restore();
        y += panel * scale;
      }
    }

    canvas.onpaint = () => {
      const t = tl.time();
      ctx.reset();
      unfold(sheets.skill, opened(t, 0.35, 3.7));
      unfold(sheets.list, opened(t, 4.0, 6.4));
      unfold(sheets.swift, opened(t, 6.7, 8.3));
      painted?.();
    };

    window.addEventListener("hf-seek", (e) => {
      const time = e.detail.time;
      if (time < START || time >= START + DURATION) return;
      e.detail.waitUntil(new Promise((resolve) => { painted = resolve; canvas.requestPaint(); setTimeout(resolve, 400); }));
    });
    canvas.requestPaint();
    window.__timelines["discover"] = tl;
  </script>
