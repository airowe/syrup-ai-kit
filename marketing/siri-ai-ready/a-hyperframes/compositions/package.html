  <script>
    const tl = gsap.timeline({ paused: true });
    const land = (sel, at) => {
      tl.fromTo(sel, { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "back.out(1.5)" }, at);
    };
    tl.fromTo("#package-chips .package-chip", { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power2.out", stagger: 0.12 }, 2.3);
    land("#package-smooth", 3.6);
    land("#package-richer", 5.4);
    tl.to(["#package-chips", "#package-smooth", "#package-richer"], { opacity: 0, y: -20, duration: 0.3, ease: "power2.in" }, 8.05);
    tl.fromTo("#package-open .package-open-pill", { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "back.out(2)", transformOrigin: "left center" }, 8.4);
    tl.fromTo("#package-open .package-open-note", { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power2.out" }, 8.65);
    land("#package-hand", 10.0);
    tl.fromTo("#package-agent", { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "back.out(1.5)" }, 11.5);
    tl.fromTo("#package-agent .package-cmd", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.5, ease: "none", stagger: 0.45 }, 11.75);
    tl.to({}, { duration: 13.651 }, 0);

    const host = document.querySelector('[data-composition-id="package"][data-start]');
    const START = Number(host.dataset.start);
    const DURATION = Number(host.dataset.duration);
    const canvas = document.getElementById("package-canvas");
    const title = document.getElementById("package-title");
    const ctx = canvas.getContext("2d");
    let painted = null;

    function meltIn(el, x0, y0, width, t, start, duration) {
      const p = Math.min(Math.max((t - start) / duration, 0), 1);
      if (p <= 0) return;
      const STRIPS = 40;
      const strip = width / STRIPS;
      for (let i = 0; i < STRIPS; i++) {
        const delay = ((Math.sin(i * 2.3) + 1) / 2) * 0.4;
        const q = Math.min(Math.max((p - delay) / 0.6, 0), 1);
        if (q <= 0) continue;
        const settle = 1 - Math.pow(1 - q, 3);
        ctx.save();
        ctx.beginPath();
        ctx.rect(x0 + i * strip, 0, strip + 0.6, 1920);
        ctx.clip();
        ctx.globalAlpha = Math.min(1, q * 1.6);
        ctx.drawElementImage(el, x0, y0 - 54 * (1 - settle));
        ctx.restore();
      }
    }

    canvas.onpaint = () => {
      const t = tl.time();
      ctx.reset();
      meltIn(title, 70, 190, 940, t, 0.85, 1.1);
      painted?.();
    };

    window.addEventListener("hf-seek", (e) => {
      const time = e.detail.time;
      if (time < START || time >= START + DURATION) return;
      e.detail.waitUntil(new Promise((resolve) => { painted = resolve; canvas.requestPaint(); setTimeout(resolve, 400); }));
    });
    canvas.requestPaint();
    window.__timelines["package"] = tl;
  </script>
